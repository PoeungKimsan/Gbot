[project]
name = "xauusd-lab"
version = "0.0.0"
description = "Research lab for an automated XAUUSD trading engine: OANDA feed, ICT strategy, pessimistic fills, hash-chained SQLite journal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pyarrow",
    "aiohttp",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "PyYAML",
    "numpy",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/engine", "api"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["engine/tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "posix_only: POSIX-only test. Automatically skipped on Windows (see engine/tests/conftest.py).",
    "slow: Long-running or resource-heavy test. Exclude with '-m \"not slow\"'.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine/src", "api"]
extend-exclude = ["web", "node_modules"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "S",      # flake8-bandit
    "ANN",    # flake8-annotations
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "TID",    # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"engine/tests/**/*.py" = [
    "S101",    # asserts are the point of tests
    "ANN201",  # test functions return None implicitly
    "ANN202",  # private test helpers return None implicitly
    "ANN001",  # fixture/argument types are inferred from the signature
    "ANN204",  # __init__ needs no return annotation
    "ANN401",  # test doubles and fake payloads are dynamically typed by construction
]

# The engine's I/O and coercion boundaries legitimately accept Any, because the value's
# shape is validated inside each function rather than by a static annotation.
"engine/src/engine/domain/*.py" = ["ANN401"]
"engine/src/engine/execution/*.py" = ["ANN401"]
"engine/src/engine/journal/*.py" = [
    "ANN401",
    # JournalExhausted is deliberately not named *Error: it is a *condition* with its own
    # exit code (70), caught precisely at the boundary that maps it. Renaming it to
    # JournalExhaustedError would read as a bug rather than a deliberate state.
    "N818",
]
# BelowMinimumTradeSize is a *condition*, not an *Error*: a below-minimum position is a
# declined opportunity (small account, wide stop) rather than a defect in the input, and
# a caller must be able to tell the two apart. Renaming it would read as a bug.
# Same reasoning as JournalExhausted above.
"engine/src/engine/risk/*.py" = ["N818"]
# The reporting tests deliberately perturb the process's global RNG to prove the
# bootstrap interval is a function of its seed and nothing else. That perturbation
# is the test.
"engine/tests/metrics/**/*.py" = ["S311"]

# The control-plane tests pass tokens as arguments and defaults, which is what a
# test of an authenticated endpoint has to do: the token is the subject under test,
# not a credential. S106/S107 name the *shape* of the pass, which is the point.
"engine/tests/runtime/**/*.py" = ["S106", "S107"]

# Two scripts are executed from tests: the CLI client through ``--help``, and the
# project's own ``sys.executable``. Both are the repository's own code, on a
# controlled argv, which is not untrusted input.
"scripts/**/*.py" = ["S105"]
"engine/tests/runtime/test_xauusdctl.py" = ["S603"]
