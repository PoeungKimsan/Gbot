# APCA_API_KEY_ID and APCA_API_SECRET_KEY.

paper_mode: true
base_url: "https://paper-api.alpaca.markets"
rebalance_frequency: "monthly"
universe:
  - "SPY"
  - "QQQ"
  - "IWM"
  - "EFA"
  - "EEM"
  - "IEF"
  - "TLT"
  - "SHY"
  - "LQD"
  - "VNQ"
  - "GLD"
