name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # Always install from the committed lockfile: CI must reproduce exactly
      # what uv.lock resolves, never a fresh resolve.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .

  web:
    name: web (ubuntu-latest)
    # hashFiles() must live on step-level `if:` conditions — GitHub rejects it
    # in a job-level `if:` with "Unrecognized function", which fails the whole
    # workflow at parse time rather than skipping this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "20"
      - name: Install and build
        if: hashFiles('web/package.json') != ''
        run: npm ci && npm run build
        working-directory: web
