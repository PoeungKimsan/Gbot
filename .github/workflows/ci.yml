name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # Always install from the committed lockfile: CI must reproduce exactly
      # what uv.lock resolves, never a fresh resolve.
      - name: Sync dependencies
        run: uv sync --frozen

      # The SQLite startup gate is deliberately NOT run here. GitHub runners
      # link the host's libsqlite3 (3.45.1 on ubuntu-latest, ~3.43-3.50.4 on
      # macos-latest), which is below every accepted baseline, so the gate
      # blocks with exit 78 before pytest ever runs. A gate is never loosened
      # to make a host pass, and a runner is an ephemeral non-deployment host:
      # the gate protects the host that writes the journal, not CI. It still
      # runs there, via `uv run python -m engine.runtime.gates`, and records
      # blockers in docs/BLOCKERS.md. This print step keeps the library version
      # visible in the log. See docs/ASSUMPTIONS.md A58.
      - name: Report loaded SQLite
        run: uv run python -c "import sqlite3, sys; print(f'python={sys.version.split()[0]} sqlite={sqlite3.sqlite_version} tuple={sqlite3.sqlite_version_info}')"

      - name: Test
        run: |
          set -o pipefail
          uv run pytest -q --tb=line -rf 2>&1 | tee pytest.log
        shell: bash

      # TEMPORARY diagnostic: job logs require a GitHub login, and the suite
      # fails on the runners while passing locally. Step logs are mirrored into
      # run annotations, which are visible on the public run page. Remove once
      # the runner-only failure is identified.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          echo "::notice title=interpreter::$(uv run python -c 'import sqlite3, sys; print(sys.version.split()[0], "sqlite=" + sqlite3.sqlite_version)')"
          grep -E '^FAILED' pytest.log | head -10 | while read -r line; do
            echo "::error title=test failure::$line"
          done
          echo "::notice title=summary::$(grep -E '[0-9]+ (failed|passed)' pytest.log | tail -1)"

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .

  web:
    name: web (ubuntu-latest)
    # No dashboard yet: this job stays dormant until web/package.json exists.
    # hashFiles() must live on step-level `if:` conditions — GitHub rejects it
    # in a job-level `if:` with "Unrecognized function", which fails the whole
    # workflow at parse time rather than skipping this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "20"
      - name: Install and build
        if: hashFiles('web/package.json') != ''
        run: npm ci && npm run build
        working-directory: web
