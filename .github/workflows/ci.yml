name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # Always install from the committed lockfile: CI must reproduce exactly
      # what uv.lock resolves, never a fresh resolve.
      - name: Sync dependencies
        run: uv sync --frozen

      # The startup gate is only trustworthy if we know which SQLite the
      # interpreter actually linked against, so print it before the run.
      - name: Report loaded SQLite
        run: uv run python -c "import sqlite3, sys; print(f'python={sys.version.split()[0]} sqlite={sqlite3.sqlite_version} tuple={sqlite3.sqlite_version_info}')"

      # Hard gate: a host below the supported SQLite floors exits 78 here and
      # writes docs/BLOCKERS.md, which is the intended stop.
      - name: Startup gates
        run: uv run python -m engine.runtime.gates

      - name: Test
        run: uv run pytest

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .

  web:
    name: web (ubuntu-latest)
    # No dashboard yet: this job stays dormant until web/package.json exists.
    if: ${{ hashFiles('web/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: npm ci && npm run build
        working-directory: web
