name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # Always install from the committed lockfile: CI must reproduce exactly
      # what uv.lock resolves, never a fresh resolve.
      - name: Sync dependencies
        run: uv sync --frozen

      # The SQLite startup gate is deliberately NOT run here. GitHub runners
      # link the host's libsqlite3 (3.45.1 on ubuntu-latest, ~3.43-3.50.4 on
      # macos-latest), which is below every accepted baseline, so the gate
      # blocks with exit 78 before pytest ever runs. A gate is never loosened
      # to make a host pass, and a runner is an ephemeral non-deployment host:
      # the gate protects the host that writes the journal, not CI. It still
      # runs there, via `uv run python -m engine.runtime.gates`, and records
      # blockers in docs/BLOCKERS.md. This print step keeps the library version
      # visible in the log. See docs/ASSUMPTIONS.md A58.
      - name: Report loaded SQLite
        run: uv run python -c "import sqlite3, sys; print(f'python={sys.version.split()[0]} sqlite={sqlite3.sqlite_version} tuple={sqlite3.sqlite_version_info}')"

      - name: Test
        run: uv run pytest

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .

  # systemd units are verified on a real Linux host: systemd-analyze is not available on
  # macOS or Windows runners, and the units are only ever run on Ubuntu. The accounts must
  # exist for `User=`/`Group=` to resolve, so the job creates them.
  deploy:
    name: deploy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      # The three accounts and two groups the units and the deploy script require.
      # systemd-analyze treats an unknown User= as an error, so they have to exist first.
      - name: Create the deployment accounts and groups
        run: |
          set -euo pipefail
          for group in xauusd-journal xauusd-proj; do
            getent group "$group" >/dev/null || groupadd --system "$group"
          done
          for user in xauusd-engine xauusd-pub xauusd-web; do
            id -u "$user" >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin "$user"
          done
          # The publisher runs as xauusd-pub in both groups; the web user in one.
          usermod --append --groups xauusd-journal xauusd-pub
          usermod --append --groups xauusd-proj xauusd-pub
          usermod --append --groups xauusd-proj xauusd-web

      - name: Verify units with systemd-analyze
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          systemd-analyze verify systemd/xauusd-*.service systemd/xauusd-*.timer

      - name: Check the deployment scripts
        run: |
          set -euo pipefail
          bash -n scripts/make_release.sh
          bash -n scripts/deploy_ubuntu.sh
          test -x scripts/make_release.sh || { echo "make_release.sh is not executable"; exit 1; }
          test -x scripts/deploy_ubuntu.sh || { echo "deploy_ubuntu.sh is not executable"; exit 1; }

      - name: Unit tests for the deployment
        run: uv run pytest engine/tests/deploy -m "not slow"

      - name: Fault-injection drills
        # The POSIX-only drills skip on Windows but run here: the hard-crash drill needs a
        # real SIGKILL, and CI is the only place this repository has one.
        run: uv run pytest engine/tests/test_fault_injection.py -m "not slow"

  web:
    name: web (ubuntu-latest)
    # No dashboard yet: this job stays dormant until web/package.json exists.
    # hashFiles() must live on step-level `if:` conditions — GitHub rejects it
    # in a job-level `if:` with "Unrecognized function", which fails the whole
    # workflow at parse time rather than skipping this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "20"
      - name: Install and build
        if: hashFiles('web/package.json') != ''
        run: npm ci && npm run build
        working-directory: web
